name: Auto-Push Changes

on:
  # Exécuté toutes les 6 heures
  schedule:
    - cron: '0 */6 * * *'
  
  # Exécuté manuellement depuis l'interface GitHub
  workflow_dispatch:

jobs:
  sync-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
      
      - name: Update changelog
        run: |
          # Générer un changelog basé sur les commits récents
          echo "## Dernières modifications ($(date '+%Y-%m-%d'))" > CHANGELOG.md
          git log --pretty=format:"- %s" -n 10 >> CHANGELOG.md
      
      - name: Commit and push changelog
        run: |
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "Auto-update: Mise à jour du changelog $(date '+%Y-%m-%d')"
          git push